<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>폭염·폭우 지도 (2015–2024, 500m 격자)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#E4EBEE; --ink:#1B2A31; --muted:#56666E; --panel:rgba(255,255,255,.95); --edge:rgba(27,42,49,.14);
  --btn:#FFFFFF; --btn-on:#1B2A31; --btn-on-ink:#FFFFFF; --sgg:rgba(27,42,49,.38); --sido:rgba(27,42,49,.85); --casing:rgba(255,255,255,.55); --coast:rgba(27,42,49,.35);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sea:#0E1920; --ink:#E4ECEF; --muted:#9CACB3; --panel:rgba(16,27,33,.95); --edge:rgba(228,236,239,.14);
  --btn:#16252C; --btn-on:#E4ECEF; --btn-on-ink:#0E1920; --sgg:rgba(228,236,239,.35); --sido:rgba(228,236,239,.85); --casing:rgba(14,25,32,.55); --coast:rgba(228,236,239,.3); } }
:root[data-theme="dark"]{ --sea:#0E1920; --ink:#E4ECEF; --muted:#9CACB3; --panel:rgba(16,27,33,.95); --edge:rgba(228,236,239,.14);
  --btn:#16252C; --btn-on:#E4ECEF; --btn-on-ink:#0E1920; --sgg:rgba(228,236,239,.35); --sido:rgba(228,236,239,.85); --casing:rgba(14,25,32,.55); --coast:rgba(228,236,239,.3); }
html,body{height:100%;min-height:600px;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--sea);color:var(--ink);overflow:hidden;position:relative}
#grid,#over{position:absolute;inset:0;width:100%;height:100%;display:block}
#over{touch-action:none;cursor:crosshair}
.lvl{fill:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
#coast{stroke:var(--coast);stroke-width:.6px}#sgg{stroke:var(--sgg);stroke-width:.7px}#sidoCase{stroke:var(--casing);stroke-width:3px}#sido{stroke:var(--sido);stroke-width:1.4px}
#cell{fill:none;stroke:#1B2A31;stroke-width:1.5px;vector-effect:non-scaling-stroke;pointer-events:none}
.panel{position:absolute;background:var(--panel);border:1px solid var(--edge);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#head{top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;padding:15px 17px 13px;width:min(390px,calc(100vw - 28px))}
h1{font-size:1.15rem;line-height:1.3;font-weight:600;margin:0 0 3px;letter-spacing:-.01em}
.sub{font-size:.76rem;color:var(--muted);margin:0 0 10px;line-height:1.5}
.row{margin:0 0 8px}.lab{font-size:.7rem;color:var(--muted);margin:0 0 3px}
.seg{display:grid;border:1px solid var(--edge);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 2px;background:var(--btn);color:var(--ink);font:inherit;font-size:.78rem;cursor:pointer;line-height:1.25}
.seg button + button{border-left:1px solid var(--edge)}
.seg button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink);font-weight:600}
.seg small{display:block;font-size:.64rem;opacity:.7;font-weight:400}
button:focus-visible,input:focus-visible{outline:2px solid #C0622D;outline-offset:1px}
.def{font-size:.72rem;color:var(--muted);margin:6px 0 0;line-height:1.5}
.yr{display:flex;align-items:center;gap:8px;margin-top:6px}
.yr input{flex:1;accent-color:#1B2A31}
.yr output{font-size:.95rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:3em;text-align:right}
.play{font:inherit;font-size:.74rem;padding:4px 8px;border-radius:6px;border:1px solid var(--edge);background:var(--btn);color:var(--ink);cursor:pointer}
.bar{display:grid;height:11px;border-radius:3px;overflow:hidden;margin-top:8px}
.ticks{display:grid;font-size:.64rem;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.ticks span{transform:translateX(-50%);white-space:nowrap}.ticks span:first-child{transform:none}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.7rem;color:var(--muted);margin-top:6px}
.keys span{display:inline-flex;align-items:center;gap:5px}
.ln{display:inline-block;width:18px;height:0;vertical-align:middle}
.views{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap}
.views button{font:inherit;font-size:.74rem;padding:4px 8px;border-radius:7px;border:1px solid var(--edge);background:var(--btn);color:var(--ink);cursor:pointer}
#read{right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:13px 16px;width:min(310px,calc(100vw - 28px))}
#read .name{font-size:1rem;font-weight:600;margin:0}#read .where{font-size:.74rem;color:var(--muted);margin:2px 0 0}
#read .big{font-size:1.55rem;font-weight:500;margin:6px 0 0;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#read .big small{font-size:.85rem;color:var(--muted);font-weight:400;margin-left:3px}
.spark{display:block;width:100%;height:64px;margin-top:6px}
.spark text{font-size:9px;fill:var(--muted);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:auto auto;gap:3px 14px;font-size:.78rem;margin:8px 0 0;font-variant-numeric:tabular-nums}
.stats dt{color:var(--muted)}.stats dd{margin:0;text-align:right}
.how{font-size:.7rem;color:var(--muted);margin:7px 0 0;line-height:1.5}
#err{display:none;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;font-size:.9rem;max-width:min(460px,calc(100vw - 40px));line-height:1.5}
#err small{color:var(--muted);font-size:.78rem}
@media (max-width:680px){#head{padding:11px 13px}.sub,.def{display:none}#read{left:14px;right:14px;width:auto}}
</style>
</head>
<body>
<canvas id="grid" aria-hidden="true"></canvas>
<svg id="over" role="img" aria-label="500m 격자별 폭염·폭우 일수 지도"></svg>
<section id="head" class="panel">
  <h1>폭염·폭우 지도</h1>
  <p class="sub">기상청 500m 격자, 2015~2024년. 기준을 넘은 날이 한 해에 며칠이었는지 보여 줘요.</p>
  <div class="row"><div class="seg" id="hazard" style="grid-template-columns:1fr 1fr">
    <button data-v="heat" aria-pressed="true">폭염</button><button data-v="rain" aria-pressed="false">폭우</button></div></div>
  <div class="row"><p class="lab">기준</p><div class="seg" id="var"></div><p class="def" id="def"></p></div>
  <div class="row"><p class="lab">보기</p><div class="seg" id="mode" style="grid-template-columns:1fr 1fr 1.25fr">
    <button data-v="year" aria-pressed="true">연도별</button><button data-v="mean" aria-pressed="false">10년 평균</button><button data-v="diff" aria-pressed="false">전반·후반 비교</button></div>
    <div class="yr" id="yrbox"><button class="play" id="play" aria-label="연도 자동 넘기기">▶ 재생</button><input type="range" id="yr" min="2015" max="2024" step="1" value="2024" aria-label="연도"><output id="yro">2024</output></div></div>
  <div id="legend"></div>
  <div class="views" role="group" aria-label="보기 범위">
    <button data-v="all">전국</button><button data-v="metro">수도권</button><button data-v="chung">충청</button><button data-v="honam">호남</button><button data-v="yeongnam">영남</button><button data-v="gangwon">강원</button><button data-v="jeju">제주</button>
  </div>
</section>
<section id="read" class="panel" aria-live="polite"><p class="how">불러오는 중…</p></section>
<section id="err" class="panel">지도를 불러오지 못했어요.</section>
<script src="lib/d3.min.js"></script>
<script>window.d3||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"><\/script>')</script>
<script src="lib/topojson-client.min.js"></script>
<script>window.topojson||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson-client/3.1.0/topojson-client.min.js"><\/script>')</script>
<script>
(async function(){
const err=m=>{ const e=document.getElementById('err'); e.style.display='block'; e.innerHTML='지도를 불러오지 못했어요.<br><small>'+m+'</small>'; };
if(!window.d3||!window.topojson){ err('지도 라이브러리를 불러오지 못했어요. 저장소에 lib 폴더가 있는지 확인하세요.'); return; }
if(location.protocol==='file:'){ err('파일을 더블클릭해 열면 자료를 읽을 수 없어요. GitHub Pages 주소로 열어 주세요.'); return; }
const getJSON=async f=>{ const r=await fetch(f).catch(()=>{ throw f+' 를 받지 못했어요.'; }); if(!r.ok) throw f+' 가 없어요(HTTP '+r.status+').'; return r.json(); };
// .gz 자료: 서버가 이미 풀어서 보냈으면 그대로, 아니면 브라우저에서 푼다
async function getGz(f){ const r=await fetch(f); if(!r.ok) throw f+' 가 없어요(HTTP '+r.status+').';
  const buf=new Uint8Array(await r.arrayBuffer()); if(!(buf[0]===0x1f&&buf[1]===0x8b)) return buf;
  if(!('DecompressionStream' in window)) throw '이 브라우저는 압축 자료를 풀지 못해요. 크롬·엣지·사파리 최신판으로 열어 주세요.';
  const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
let G,BND,META,DONG;
try{ [G,BND,META]=await Promise.all([getJSON('data/grid.json'),getJSON('data/bnd.topo.json'),getJSON('meta.json')]);
  const d=await getGz('data/dong.bin.gz'); DONG=new Uint16Array(d.buffer,d.byteOffset,d.byteLength/2); }catch(e){ err(String(e)); return; }
const W=G.W,H=G.H,Y=G.years,E=G.ext;   // E = [x0,y0,x1,y1] 격자 가장자리 (람베르트 정각원추, m)
// ---------- 변수와 색
const HEAT=["#F3F0E8","#FBE7BE","#F6CB8F","#F0A864","#E4803F","#CC5530","#A43522","#6E1C17"];
const RAIN=["#EFF2F4","#D5E5F1","#AECDE5","#7EB0D6","#4F8EC2","#2E6CA6","#1D4E86","#0F305E"];
const DIV_H=["#2B5C8A","#5B8DB8","#9BBFD9","#D2E2EC","#EEEFEF","#F5D3BD","#EBA07A","#D1603C","#992E1F"];
const DIV_R=["#8A5A2B","#B8875B","#D9BE9B","#ECE0D2","#EEEFEF","#CFE0EE","#8FB9DB","#4F8BC0","#1F4F87"];
const V={
 heat:[{k:'ta33',t:'최고기온',s:'33℃ 이상',d:'하루 최고기온이 33℃ 이상인 날 수',year:[1,5,10,20,30,40,50],mean:[1,3,5,8,12,16,20],diff:[-10,-5,-2,-.5,.5,2,5,10]},
       {k:'ta35',t:'최고기온',s:'35℃ 이상',d:'하루 최고기온이 35℃ 이상인 날 수',year:[1,2,3,5,10,15,20],mean:[.2,.5,1,2,3,5,8],diff:[-3,-1,-.5,-.1,.1,.5,1,3]},
       {k:'ts33',t:'체감온도',s:'33℃ 이상',d:'하루 최고 체감온도가 33℃ 이상인 날 수 (2020년부터 폭염특보 기준)',year:[1,5,10,20,30,40,50],mean:[1,3,5,8,12,16,20],diff:[-10,-5,-2,-.5,.5,2,5,10]},
       {k:'ts35',t:'체감온도',s:'35℃ 이상',d:'하루 최고 체감온도가 35℃ 이상인 날 수',year:[1,2,3,5,10,15,20],mean:[.2,.5,1,2,3,5,8],diff:[-3,-1,-.5,-.1,.1,.5,1,3]}],
 rain:[{k:'rn_advy',t:'호우주의보',s:'기준',d:'호우주의보 기준(3시간 60mm 이상 또는 12시간 110mm 이상)을 넘은 날 수',year:[1,2,3,4,5,7,10],mean:[.2,.4,.6,.8,1,1.5,2],diff:[-1,-.5,-.2,-.05,.05,.2,.5,1]},
       {k:'rn_warn',t:'호우경보',s:'기준',d:'호우경보 기준(3시간 90mm 이상 또는 12시간 180mm 이상)을 넘은 날 수',year:[1,2,3,4,5],mean:[.05,.1,.2,.3,.5],diff:[-.4,-.2,-.1,-.02,.02,.1,.2,.4]},
       {k:'rn_extrm',t:'극한호우',s:'기준',d:'극한호우 기준(1시간 50mm 이상이면서 3시간 90mm 이상)을 넘은 날 수',year:[1,2],mean:[.05,.1,.2,.3],diff:[-.2,-.1,-.05,-.01,.01,.05,.1,.2]}]};
const S={hz:'heat',vi:0,mode:'year',yi:9,data:null,vals:null};
const cur=()=>V[S.hz][S.vi];
const cache=new Map();
async function loadVar(k){ if(!cache.has(k)) cache.set(k,getGz(`data/${k}.bin.gz`)); return cache.get(k); }
// ---------- 지도 틀 (격자 가장자리에 맞춘 좌표)
const over=d3.select("#over"), cv=document.getElementById("grid"), ctx=cv.getContext("2d");
const off=document.createElement("canvas"); off.width=W; off.height=H; const octx=off.getContext("2d"); const img=octx.createImageData(W,H);
const frame={type:"Feature",geometry:{type:"Polygon",coordinates:[[[E[0],E[1]],[E[2],E[1]],[E[2],E[3]],[E[0],E[3]],[E[0],E[1]]]]}};
const proj=d3.geoIdentity().reflectY(true), path=d3.geoPath(proj);
const g=over.append("g");
const obj=BND.objects.sgg, sc=f=>f.properties.SGG;
const coast=g.append("path").attr("id","coast").attr("class","lvl"), sggL=g.append("path").attr("id","sgg").attr("class","lvl"),
      sidoC=g.append("path").attr("id","sidoCase").attr("class","lvl"), sidoL=g.append("path").attr("id","sido").attr("class","lvl"), cellR=g.append("rect").attr("id","cell");
const MC=topojson.mesh(BND,obj,(a,b)=>a===b), MS=topojson.mesh(BND,obj,(a,b)=>a!==b&&sc(a)!==sc(b)), MD=topojson.mesh(BND,obj,(a,b)=>a!==b&&sc(a).slice(0,2)!==sc(b).slice(0,2));
let Wc=0,Hc=0,left=0,T=d3.zoomIdentity; const dpr=Math.max(1,window.devicePixelRatio||1);
function render(){ ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.setTransform(dpr,0,0,dpr,0,0);
  const [ax,ay]=proj([E[0],E[3]]), [bx,by]=proj([E[2],E[1]]);
  ctx.imageSmoothingEnabled=false; ctx.drawImage(off,T.applyX(ax),T.applyY(ay),(bx-ax)*T.k,(by-ay)*T.k); }
let raf=0; const req=()=>{ if(!raf) raf=requestAnimationFrame(()=>{ raf=0; render(); }); };
const zoom=d3.zoom().scaleExtent([1,60]).on("zoom",e=>{ T=e.transform; g.attr("transform",T); sggL.style("opacity",Math.min(1,.35+T.k/5)); req(); });
over.call(zoom).on("dblclick.zoom",null);
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function toBox(b,dur){ const [x0,y1]=proj([b[0],b[1]]), [x1,y0]=proj([b[2],b[3]]);
  const k=Math.min(60,0.9/Math.max((x1-x0)/(Wc-left),(y1-y0)/Hc));
  over.transition().duration(reduce?0:dur).call(zoom.transform,d3.zoomIdentity.translate(left+(Wc-left)/2,Hc/2).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2)); }
function size(){ const r=over.node().getBoundingClientRect(); if(r.width<50||r.height<50) return;
  if(Math.abs(r.width-Wc)<1&&Math.abs(r.height-Hc)<1) return; Wc=r.width; Hc=r.height;
  cv.width=Math.round(Wc*dpr); cv.height=Math.round(Hc*dpr); over.attr("viewBox",`0 0 ${Wc} ${Hc}`);
  left=Wc>780?420:0; const pad=Math.min(Wc,Hc)*0.04, top=Wc>780?0:Math.min(360,Hc*0.45), bottom=Wc>780?0:Math.min(190,Hc*0.25);
  proj.fitExtent([[left+pad,top+pad],[Wc-pad,Hc-bottom-pad]],frame);
  coast.attr("d",path(MC)); sggL.attr("d",path(MS)); sidoC.attr("d",path(MD)); sidoL.attr("d",path(MD)); cellR.attr("width",0);
  over.call(zoom.transform,d3.zoomIdentity); req(); }
new ResizeObserver(size).observe(over.node()); size();
// ---------- 값 계산과 색칠
const N=W*H;
function values(){ const D=S.data, out=new Float32Array(N).fill(NaN);
  if(S.mode==='year'){ const o=S.yi*N; for(let i=0;i<N;i++){ const v=D[o+i]; if(v!==255) out[i]=v; } }
  else { for(let i=0;i<N;i++){ if(D[i]===255) continue; let a=0,b=0; for(let y=0;y<5;y++) a+=D[y*N+i]; for(let y=5;y<10;y++) b+=D[y*N+i];
    out[i]= S.mode==='mean' ? (a+b)/10 : (b-a)/5; } }
  return out; }
function scale(){ const c=cur(); const br=c[S.mode], pal=S.mode==='diff'?(S.hz==='heat'?DIV_H:DIV_R):(S.hz==='heat'?HEAT:RAIN);
  const cols=S.mode==='diff'?pal:pal.slice(0,br.length+1);
  return {br,cols,f:v=> v!==v? null : cols[d3.bisectRight(br,v)]}; }
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function paint(){ if(!S.data) return; S.vals=values(); const sc_=scale(), rgb=sc_.cols.map(hex), px=img.data, br=sc_.br;
  for(let i=0;i<N;i++){ const v=S.vals[i], o=i*4; if(v!==v){ px[o+3]=0; continue; } const c=rgb[d3.bisectRight(br,v)]; px[o]=c[0]; px[o+1]=c[1]; px[o+2]=c[2]; px[o+3]=255; }
  octx.putImageData(img,0,0); req(); legend(sc_); summary(); }
// ---------- 범례·설명
const fmtN=v=>{ const a=Math.abs(v); return (a>=10||Number.isInteger(v))? String(Math.round(v*10)/10) : a>=1? v.toFixed(1) : v.toFixed(2).replace(/0$/,''); };
function legend(sc_){ const L=d3.select("#legend").html(""), n=sc_.cols.length;
  L.append("div").attr("class","bar").style("grid-template-columns",`repeat(${n},1fr)`).selectAll("span").data(sc_.cols).join("span").style("background",c=>c);
  const tk=[""].concat(sc_.br.map(b=>(S.mode==='diff'&&b>0?"+":"")+fmtN(b)));
  L.append("div").attr("class","ticks").style("grid-template-columns",`repeat(${n},1fr)`).selectAll("span").data(tk).join("span").text(t=>t);
  const u=S.mode==='year'?`${Y[S.yi]}년, 한 해의 날 수(일)`:S.mode==='mean'?"2015~2024년 연평균 날 수(일)":"2020~24년 연평균 − 2015~19년 연평균 (일)";
  L.append("div").attr("class","keys").html(`<span>${u}</span><span><i class="ln" style="border-top:1.4px solid var(--sido)"></i>시도</span><span><i class="ln" style="border-top:1px solid var(--sgg)"></i>시군구</span>`); }
function setVarButtons(){ const b=d3.select("#var").style("grid-template-columns",`repeat(${V[S.hz].length},1fr)`).selectAll("button").data(V[S.hz],d=>d.k)
  .join("button").attr("aria-pressed",(d,i)=>String(i===S.vi)).html(d=>`${d.t}<small>${d.s}</small>`)
  .on("click",(e,d)=>{ S.vi=V[S.hz].indexOf(d); setVarButtons(); load(); });
  d3.select("#def").text(cur().d); }
// ---------- 요약과 격자 정보
function summary(){ const v=S.vals; let n=0,s=0,mx=-1e9,pos=0; for(let i=0;i<N;i++){ const x=v[i]; if(x!==x) continue; n++; s+=x; if(x>mx) mx=x; if(x>0) pos++; }
  const c=cur(), R=d3.select("#read"), mean=s/n;
  const head=`<p class="name">${c.t} ${c.s}</p><p class="where">${S.mode==='year'?Y[S.yi]+'년':S.mode==='mean'?'2015~2024년 연평균':'2015~19년 → 2020~24년 연평균의 변화'}, 전국 500m 격자 ${n.toLocaleString()}칸</p>`;
  const st=G.stats[c.k].mean_by_year, e5=d3.mean(st.slice(0,5)), l5=d3.mean(st.slice(5));
  R.html(head+`<dl class="stats">${S.mode==='diff'?`<dt>전국 격자 평균 변화</dt><dd>${mean>0?'+':''}${fmtN(mean)}일</dd><dt>2015~19년 평균</dt><dd>${fmtN(e5)}일</dd><dt>2020~24년 평균</dt><dd>${fmtN(l5)}일</dd><dt>늘어난 칸의 비율</dt><dd>${(pos/n*100).toFixed(0)}%</dd>`
    :`<dt>전국 격자 평균</dt><dd>${fmtN(mean)}일</dd><dt>가장 많은 칸</dt><dd>${fmtN(mx)}일</dd><dt>${S.mode==='mean'?'10년 동안 한 번이라도 있었던 칸':'하루 이상인 칸의 비율'}</dt><dd>${(pos/n*100).toFixed(0)}%</dd>`}</dl>
  ${spark(st,S.mode==='year'?S.yi:-1,'전국 격자 평균')}<p class="how">${S.mode==='diff'?(S.hz==='heat'?'역대급 폭염이던 2018년이 앞 5년에 들어 있어, 뒤 5년이 줄어 보이는 곳이 많아요. 5년 평균 비교는 특정 해의 영향을 크게 받아요. ':'2020년 긴 장마처럼 특정 해의 영향을 크게 받아요. '):''}격자에 마우스를 올리면 그 칸의 값과 동 이름이 나와요.</p>`); }
function spark(a,hl,label){ const w=280,h=64,bw=w/10, mx=Math.max(...a,1e-9);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${label} 연도별 막대">`+a.map((v,i)=>{ const bh=Math.max(v>0?1.5:0,(v/mx)*(h-20));
    return `<rect x="${i*bw+3}" y="${h-12-bh}" width="${bw-6}" height="${bh}" rx="1.5" fill="${S.hz==='heat'?'#CC5530':'#2E6CA6'}" opacity="${hl<0||i===hl?1:.45}"/>`+
      `<text x="${i*bw+bw/2}" y="${h-2}" text-anchor="middle">${String(Y[i]).slice(2)}</text>`+(i===hl||hl<0&&i===9?`<text x="${i*bw+bw/2}" y="${h-15-bh}" text-anchor="middle">${fmtN(v)}</text>`:'');
  }).join('')+`</svg>`; }
function cellAt(mx,my){ const [ux,uy]=T.invert([mx,my]); const [x,y]=proj.invert([ux,uy]);
  const c=Math.floor((x-E[0])/500), r=Math.floor((E[3]-y)/500); if(c<0||r<0||c>=W||r>=H) return -1; return r*W+c; }
function showCell(i){ const c=cur(), D=S.data; if(D[i]===255){ cellR.attr("width",0); summary(); return; }
  const r=Math.floor(i/W), cc=i%W, [x0,y0]=proj([E[0]+cc*500,E[3]-r*500]), [x1,y1]=proj([E[0]+(cc+1)*500,E[3]-(r+1)*500]);
  cellR.attr("x",x0).attr("y",y0).attr("width",x1-x0).attr("height",y1-y0);
  const a=Y.map((_,k)=>D[k*N+i]), di=DONG[i], nm=di<65535?`${META.n[di]}`:'', wh=di<65535?`${META.s[di]} ${META.g[di]}`:'';
  const v=S.vals[i], big=S.mode==='diff'?`${v>0?'+':''}${fmtN(v)}<small>일/년</small>`:`${fmtN(v)}<small>일</small>`;
  d3.select("#read").html(`<p class="name">${nm||'—'}</p><p class="where">${wh}</p><p class="big">${big}</p>
   <p class="how" style="margin-top:2px">${c.t} ${c.s}, ${S.mode==='year'?Y[S.yi]+'년':S.mode==='mean'?'10년 연평균':'전반 5년 → 후반 5년 연평균 변화'}</p>${spark(a,S.mode==='year'?S.yi:-1,'이 칸')}`); }
over.on("pointermove",e=>{ if(!S.data) return; const [mx,my]=d3.pointer(e); const i=cellAt(mx,my); if(i<0){ cellR.attr("width",0); return; } showCell(i); })
    .on("pointerleave",()=>{ cellR.attr("width",0); if(S.data) summary(); });
// ---------- 조작
async function load(){ d3.select("#read").html(`<p class="how">${cur().t} ${cur().s} 자료를 불러오는 중…</p>`); const k=cur().k;
  try{ const d=await loadVar(k); if(cur().k!==k) return; S.data=d; paint(); }catch(e){ err(String(e)); } }
d3.selectAll("#hazard button").on("click",function(){ d3.selectAll("#hazard button").attr("aria-pressed","false"); d3.select(this).attr("aria-pressed","true"); S.hz=this.dataset.v; S.vi=0; setVarButtons(); load(); });
d3.selectAll("#mode button").on("click",function(){ d3.selectAll("#mode button").attr("aria-pressed","false"); d3.select(this).attr("aria-pressed","true"); S.mode=this.dataset.v;
  d3.select("#yrbox").style("display",S.mode==='year'?null:"none"); stop(); paint(); });
const yr=document.getElementById("yr"), yro=document.getElementById("yro");
yr.addEventListener("input",()=>{ S.yi=+yr.value-2015; yro.textContent=yr.value; paint(); });
let timer=null; const stop=()=>{ if(timer){ clearInterval(timer); timer=null; document.getElementById("play").textContent="▶ 재생"; } };
document.getElementById("play").addEventListener("click",()=>{ if(timer){ stop(); return; } document.getElementById("play").textContent="■ 멈춤";
  timer=setInterval(()=>{ S.yi=(S.yi+1)%10; yr.value=2015+S.yi; yro.textContent=yr.value; paint(); },1100); });
d3.selectAll(".views button").on("click",function(){ const v=this.dataset.v; if(v==='all') over.transition().duration(reduce?0:650).call(zoom.transform,d3.zoomIdentity); else toBox(G.views[v],650); });
setVarButtons(); load();
})();
</script>
</body>
